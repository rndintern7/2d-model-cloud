<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Industrial Sketch AI</title>
    <style>
        body { background: #0f0f0f; color: #00d4ff; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .controls { background: #1a1a1a; padding: 20px; border-radius: 10px; border: 1px solid #333; margin-bottom: 20px; }
        #canvas { 
            width: 800px; height: 500px; background: #1a1a1a; 
            border: 2px solid #00d4ff; position: relative; overflow: hidden;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.2); border-radius: 10px;
        }
        .component {
            position: absolute; width: 140px; height: 80px;
            background: rgba(0, 212, 255, 0.1); border: 2px solid #00d4ff;
            color: white; padding: 10px; font-size: 11px; border-radius: 5px;
            backdrop-filter: blur(5px); box-sizing: border-box;
        }
        button { background: #00d4ff; color: #000; border: none; padding: 10px 20px; border-radius: 5px; font-weight: bold; cursor: pointer; }
        button:disabled { background: #444; color: #888; }
    </style>
</head>
<body>
    <h1>Industrial Sketch-to-2D Model</h1>
    <div class="controls">
        <input type="file" id="fileInput" accept="image/*">
        <button id="btn" onclick="process()">Generate 2D Model</button>
    </div>
    <div id="canvas"></div>

    <script>
        async function process() {
            const fileInput = document.getElementById('fileInput');
            const btn = document.getElementById('btn');
            const canvas = document.getElementById('canvas');

            if (!fileInput.files[0]) return alert("Please select a sketch image first!");

            btn.disabled = true;
            canvas.innerHTML = "<p style='text-align:center; margin-top:220px; font-size: 20px;'>AI Analyzing Sketch... Please wait.</p>";

            const formData = new FormData();
            formData.append('image', fileInput.files[0]);

            try {
                const response = await fetch('/analyze', { method: 'POST', body: formData });
                const data = await response.json();

                if (data.error) throw new Error(data.error);

                canvas.innerHTML = ""; // Clear the loading text
                
                data.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'component';
                    div.style.left = item.x + 'px';
                    div.style.top = item.y + 'px';
                    div.innerHTML = `<b>${item.name}</b><hr style="border:0; border-top:1px solid #00d4ff;">${item.specs}`;
                    canvas.appendChild(div);
                });

            } catch (err) {
                console.error(err);
                alert("AI Error: " + err.message + "\n\n1. Ensure your API Key is valid.\n2. Ensure Port 3000 is PUBLIC.");
                canvas.innerHTML = "";
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
